# Service interne (ClusterIP) : Photon n'a ni authentification ni limite de
# débit, il n'est donc pas exposé hors du cluster. URL depuis le même
# namespace : http://photon:2322
apiVersion: v1
kind: Service
metadata:
  name: photon
spec:
  type: ClusterIP
  selector:
    app: photon
  ports:
    - name: http
      port: 2322
      targetPort: http
